  <!-- Alert Utility Wrapper -->
  <script>
    // Global alert and confirm wrappers using SweetAlert2
    window.showAlert = function (message, type = 'info', title = '') {
      const config = {
        text: message,
        icon: type,
        confirmButtonText: 'හරි / OK',
        confirmButtonColor: '#0b5ea8',
        customClass: {
          popup: 'swal-phi-popup',
          confirmButton: 'swal-phi-button'
        }
      };
      if (title) config.title = title;
      return Swal.fire(config);
    };

    window.showConfirm = function (message, title = 'තහවුරු කරන්න / Confirm') {
      return Swal.fire({
        title: title,
        text: message,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'ඔව් / Yes',
        cancelButtonText: 'නැත / No',
        confirmButtonColor: '#0b5ea8',
        cancelButtonColor: '#d33',
        customClass: {
          popup: 'swal-phi-popup',
          confirmButton: 'swal-phi-button',
          cancelButton: 'swal-phi-button'
        }
      }).then((result) => result.isConfirmed);
    };

    window.showSuccess = function (message, title = 'සාර්ථකයි / Success') {
      return Swal.fire({
        title: title,
        text: message,
        icon: 'success',
        confirmButtonText: 'හරි / OK',
        confirmButtonColor: '#0b5ea8',
        timer: 2000,
        customClass: {
          popup: 'swal-phi-popup',
          confirmButton: 'swal-phi-button'
        }
      });
    };

    window.showError = function (message, title = 'දෝෂයකි / Error') {
      return Swal.fire({
        title: title,
        text: message,
        icon: 'error',
        confirmButtonText: 'හරි / OK',
        confirmButtonColor: '#d33',
        customClass: {
          popup: 'swal-phi-popup',
          confirmButton: 'swal-phi-button'
        }
      });
    };

    window.showWarning = function (message, title = 'අවවාදයයි / Warning') {
      return Swal.fire({
        title: title,
        text: message,
        icon: 'warning',
        confirmButtonText: 'හරි / OK',
        confirmButtonColor: '#f39c12',
        customClass: {
          popup: 'swal-phi-popup',
          confirmButton: 'swal-phi-button'
        }
      });
    };

    // Custom styles for SweetAlert
    const style = document.createElement('style');
    style.textContent = `
      .swal-phi-popup {
        font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif !important;
        border-radius: 12px !important;
      }

        font-weight: 600 !important;
      }
      .swal2-html-container {
        font-size: 15px !important;
      }
    `;
    document.head.appendChild(style);
  </script>

  <script type="module">
    import { checkAuthStatus, logoutUser } from './js/auth/authService.js';
    import { performMigration } from './js/migrationHelper.js';
    import { initializeStorageWrapper, loadAllFromFirestore } from './js/storageWrapper.js';

    // Initialize storage wrapper FIRST
    initializeStorageWrapper();

    // Check Authentication
    checkAuthStatus(async (user, role, profileCompleted) => {
      if (!user) {
        // Redirect if not logged in
        window.location.replace('login.html');
      } else if (!profileCompleted) {
        window.location.replace('complete_profile.html');
      } else {
        // Load existing data from Firestore
        try {
          await loadAllFromFirestore();
        } catch (error) {
          console.error('Load from Firestore error:', error);
        }

        // Perform one-time data migration from localStorage to Firestore
        try {
          await performMigration(false); // Silent migration
        } catch (error) {
          console.error('Migration error:', error);
          // Continue even if migration fails
        }

        // Update Profile Info
        const profileNames = document.querySelectorAll('.profile-text strong');
        profileNames.forEach(el => el.textContent = user.displayName || user.email);

        const profileIdentity = document.querySelectorAll('.profile-text small');

        // Get role from PHI Profile for accurate designation
        const userRole = window.getUserRole ? window.getUserRole() : role;
        const roleDesignations = {
          'PHI': 'Public Health Inspector',
          'PHM': 'Public Health Midwife',
          'MOH': 'Medical Officer of Health',
          'SPHI': 'Supervising Public Health Inspector',
          'SPHM': 'Supervising Public Health Midwife',
          'AMOH': 'Additional Medical Officer of Health',
          'PHNS': 'Public Health Nursing Service'
        };

        let areaLabel = 'Public Health Inspector';
        const phiArea = localStorage.getItem('phi_info_area') || '';

        if (role === 'admin') {
          areaLabel = 'Administrator';
        } else {
          const designation = roleDesignations[userRole] || roleDesignations[role] || 'Public Health Inspector';
          areaLabel = phiArea ? `${designation} — ${phiArea}` : designation;
        }

        profileIdentity.forEach(el => el.textContent = areaLabel);

        // Show admin specific controls if needed
        if (role === 'admin') {
          // Add Admin Panel Link to Sidebar
          const navUl = document.querySelector('aside nav ul');
          const logoutLi = document.getElementById('logoutBtn');

          // Check if it already exists to prevent duplicates
          if (!document.getElementById('adminPanelLink')) {
            const adminLi = document.createElement('li');
            adminLi.id = 'adminPanelLink';
            adminLi.innerHTML = '<i class="fa-solid fa-user-shield"></i><span>Admin Panel</span>';
            adminLi.onclick = () => window.location.href = 'admin.html';

            // Insert before logout button
            navUl.insertBefore(adminLi, logoutLi);
          }
        }
      }
    });

    // Handle Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        const confirm = await Swal.fire({
          title: 'Logout?',
          text: "Are you sure you want to logout?",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#0b5ea8',
          cancelButtonColor: '#d33',
          confirmButtonText: 'Yes, Logout'
        });

        if (confirm.isConfirmed) {
          await logoutUser();
          window.location.replace('login.html');
        }
      } catch (error) {
        console.error('Logout failed', error);
      }
    });
  </script>
